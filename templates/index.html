<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Daily Balance</title>
  </head>
  <body>
    <h1>Daily Balances</h1>

    {% if balances %}
      <ul>
        {% for b in balances %}
          <li>{{ b.balance_date }} — ${{ b.balance }}</li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No balance data yet.</p>
    {% endif %}
  </body>
</html>
